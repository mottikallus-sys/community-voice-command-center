<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d2d"><title>Community Voice | Command Center</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1422;color:#edf4ff;font:16px system-ui,sans-serif}header{padding:22px max(18px,env(safe-area-inset-left));background:#142338}h1{font-size:clamp(21px,4vw,32px);margin:0}p{color:#aebfd3}header p{margin:6px 0 0}button,input,select,textarea{font:inherit;color:inherit}button{background:#233a53;border:1px solid #4a617b;border-radius:10px;min-height:44px;padding:9px 13px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7ccaff}input,select,textarea{background:#101d2d;border:1px solid #52677f;border-radius:8px;padding:12px;min-width:0}main{max-width:1500px;margin:auto;padding:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tools input{flex:1 1 220px}.hub{text-align:center;padding:20px;border:1px solid #5884a9;border-radius:16px;background:#19334c;margin:0 auto 18px;max-width:480px;font-size:23px;font-weight:700}.hub small{display:block;font-size:13px;color:#b8d3e9;margin-top:5px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.branch{border:1px solid #3c536d;border-top:4px solid var(--accent);background:#152438;border-radius:14px;padding:14px;min-width:0}.branch h2{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:18px;margin:0 0 10px}.node{display:block;width:100%;text-align:left;margin-top:8px;overflow-wrap:anywhere;background:#20334a}.node strong,.node small{display:block}.node small{color:#bdcbe0;margin-top:5px;white-space:pre-wrap;font-size:14px}.count{font-size:13px;color:#b1c5dc}dialog{background:#152438;color:#fff;border:1px solid #58738c;border-radius:16px;width:min(480px,calc(100% - 24px));max-height:90dvh;overflow:auto;padding:20px}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}label input,label textarea,label select{display:block;width:100%;margin-top:6px}.actions{display:flex;flex-wrap:wrap;gap:8px}.status{font-size:13px;color:#afc1d6;margin-top:18px}.overview .node small{display:none}.overview .node{font-size:13px;min-height:36px;padding:6px}.overview .branch{padding:8px}.overview .branch h2{font-size:14px}.overview .board{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(max-width:950px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:12px}.board{grid-template-columns:1fr}.hub{font-size:20px}.tools button{flex:1 1 auto}.overview .board{grid-template-columns:repeat(2,minmax(0,1fr))}.overview .branch h2{flex-wrap:wrap}.overview .node{min-height:44px}.branch h2 button{min-width:44px}dialog{max-height:85dvh}} 
/* Mobile-first visibility: six areas, readable names and short dates, no horizontal scrolling. */
.quicknav{display:none}.utility{display:flex;gap:6px}
@media(max-width:700px){
header{padding:12px 12px 9px}h1{font-size:20px;letter-spacing:-.4px}header p{font-size:12px;margin-top:3px}
main{padding:8px}.tools{gap:6px;margin-bottom:8px;align-items:center}.tools input{flex:1 1 130px;width:0;padding:9px;min-height:44px}.tools button{flex:0 0 auto;font-size:12px;padding:6px 9px}.utility{display:none}.tools.show-tools .utility{display:flex;flex-basis:100%}
.hub{padding:7px 10px;margin:0 0 8px;font-size:16px;max-width:none;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}.hub small{margin:0;font-size:11px}
.board,.overview .board{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-items:stretch}.branch,.overview .branch{padding:6px;border-radius:10px;border-top-width:3px}.branch h2,.overview .branch h2{font-size:12px;line-height:1.15;gap:2px;margin:0 0 3px;flex-wrap:nowrap;min-height:30px}.branch h2 button{min-width:32px;width:32px;min-height:36px;padding:0;flex:none;font-size:18px}.count{display:none}.node,.overview .node{margin-top:3px;padding:5px 6px;border-radius:6px;min-height:44px;font-size:12px;line-height:1.18;border-color:#435b75}.node small,.overview .node small{display:block;font-size:10.5px;line-height:1.15;margin-top:3px;color:#c2d3e7;white-space:normal}.node strong{font-weight:650}.detail .board{grid-template-columns:1fr}.detail .branch{padding:12px}.detail .branch h2{font-size:17px}.detail .node{font-size:15px;padding:10px}.detail .node small{font-size:13px}.status{font-size:11px;margin:9px 2px}.quicknav{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}.quicknav button{white-space:nowrap;flex:none;font-size:11px;padding:5px 9px;min-height:36px;background:#192a40}.branch{scroll-margin-top:10px}dialog{padding:16px}.actions button{flex:1}#more{display:block}
}
@media(min-width:701px){#more{display:none}}
</style></head><body><header><h1>Community Voice Media Group</h1><p>Virtual command center · Visibility first</p></header><main><div class="tools"><input id="search" type="search" placeholder="Find anything…" aria-label="Search company board"><button id="view" aria-pressed="false">Compact overview</button><button id="more" aria-expanded="false" aria-label="Backup options">•••</button><div class="utility"><button id="export">Export</button><button id="import">Import</button></div><input id="file" type="file" accept=".json,application/json" hidden></div><div class="hub">Company overview<small id="summary"></small></div><nav class="quicknav" id="quicknav" aria-label="Jump to department"></nav><div id="board" class="board"></div><p class="status" id="status" role="status">Prototype · Changes saved on this device only · Not connected to Monday.com</p></main><dialog id="editor"><form id="form"><h2 id="heading">Edit item</h2><label>Title<input id="name" required maxlength="180"></label><label>Details / dates / notes<textarea id="details" rows="5"></textarea></label><label>Department<select id="category"></select></label><div class="actions"><button type="submit">Save</button><button type="button" id="delete">Delete</button><button type="button" id="cancel">Cancel</button></div></form></dialog><script>
const groups=[['Publications','#5ab4f4'],['Special editions','#bb93f4'],['Events','#f4ba68'],['People & departments','#69d2ad'],['Digital & technology','#75cfe4'],['Sales','#f38b9e']];
const seed=[['Publications','Florida Weekly','Every Wednesday morning'],['Publications','Chicago Monthly','Monthly'],['Publications','Los Angeles Monthly','In planning'],['Special editions','Food Guide','Early 2027'],['Special editions','Health Edition','February 2027'],['Special editions','Travel Edition','April 2027'],['Special editions','Real Estate Edition','Date to be confirmed'],['Events','Cholent Contest','February 25, 2027'],['People & departments','Andrea','Administration and sales'],['People & departments','Kathy','Billing'],['People & departments','Moishe','Technology · temporary position'],['People & departments','Hoo-va','Graphic design'],['People & departments','Tovia','Sales · 9–11'],['People & departments','Yael','Sales · in training, planned 4 hours/day'],['Digital & technology','Website redesign','Moishe'],['Digital & technology','Stripe → SwipeSaver','Moishe · payment processing transition'],['Digital & technology','Internal technology','Moishe'],['Digital & technology','AI bots','Planned initiative'],['Sales','Advertising sales','Andrea, Tovia and Yael']];
const $=id=>document.getElementById(id),valid=d=>Array.isArray(d)&&d.every(n=>n&&typeof n.id==='string'&&typeof n.name==='string'&&typeof n.details==='string'&&groups.some(g=>g[0]===n.group));let data=seed.map((a,i)=>({id:String(i),group:a[0],name:a[1],details:a[2]})),current=null;try{const s=JSON.parse(localStorage.getItem('cvmap-v2'));if(valid(s))data=s}catch(e){}function save(){try{localStorage.setItem('cvmap-v2',JSON.stringify(data));$('status').textContent='Saved on this device · Not synchronized with other users'}catch(e){$('status').textContent='Storage unavailable · Export a backup to keep edits'}render()}
function render(){const q=$('search').value.trim().toLowerCase();$('board').replaceChildren();$('summary').textContent=groups.length+' areas · '+data.length+' items';for(const [g,c] of groups){const b=document.createElement('section');b.className='branch';b.id='branch-'+groups.findIndex(x=>x[0]===g);b.style.setProperty('--accent',c);const h=document.createElement('h2');h.textContent=g;const add=document.createElement('button');add.textContent='+';add.setAttribute('aria-label','Add to '+g);add.onclick=()=>edit(null,g);h.append(add);b.append(h);const matches=data.filter(n=>n.group===g&&(n.name+' '+n.details+' '+g).toLowerCase().includes(q));const count=document.createElement('div');count.className='count';count.textContent=matches.length+' items';b.append(count);for(const n of matches){const a=document.createElement('button');a.className='node';const t=document.createElement('strong'),d=document.createElement('small');t.textContent=n.name;d.textContent=n.details;a.append(t,d);a.onclick=()=>edit(n,g);b.append(a)}$('board').append(b)}}
for(const [g] of groups){const o=document.createElement('option');o.value=o.textContent=g;$('category').append(o)}function edit(n,g){current=n?.id??null;$('name').value=n?.name??'';$('details').value=n?.details??'';$('category').value=g;$('delete').hidden=!n;$('heading').textContent=n?'Edit item':'Add item';$('editor').showModal()}$('form').onsubmit=e=>{e.preventDefault();const n={id:current??(globalThis.crypto?.randomUUID?.()||String(Date.now())),group:$('category').value,name:$('name').value.trim(),details:$('details').value};if(!n.name)return;data=current===null?[...data,n]:data.map(a=>a.id===current?n:a);save();$('editor').close()};$('delete').onclick=()=>{if(confirm('Delete this item?')){data=data.filter(n=>n.id!==current);save();$('editor').close()}};$('cancel').onclick=()=>$('editor').close();$('search').oninput=render;$('view').onclick=()=>{if(matchMedia('(max-width:700px)').matches){const active=document.body.classList.toggle('detail');$('view').textContent=active?'Overview':'Detail view';$('view').setAttribute('aria-pressed',String(active));}else{const active=document.body.classList.toggle('overview');$('view').textContent=active?'Detailed view':'Compact overview';$('view').setAttribute('aria-pressed',String(active))}};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='community-voice-board-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{if(!$('file').files.length)return;const d=JSON.parse(await $('file').files[0].text());if(!valid(d))throw Error();if(confirm('Replace this device’s board with backup?')){data=d;save()}}catch(e){alert('Invalid board backup')}finally{$('file').value=''}};const mq=matchMedia('(max-width:700px)');function resetView(){document.body.classList.remove('detail','overview');$('view').textContent=mq.matches?'Detail view':'Compact overview';$('view').setAttribute('aria-pressed','false')}resetView();mq.addEventListener('change',resetView);$('more').onclick=()=>{const x=document.querySelector('.tools').classList.toggle('show-tools');$('more').setAttribute('aria-expanded',String(x))};['Publications','Editions','Events','People','Tech','Sales'].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=> $('branch-'+i)?.scrollIntoView({behavior:'smooth',block:'start'});$('quicknav').append(b)});render();
</script></body></html>
